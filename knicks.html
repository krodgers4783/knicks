<title>Knicks Tonight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column of three scoreboard panels on a Knicks-blue court; single committed look */
:root {
  --bg-top: #006bb6;
  --bg-bot: #06264d;
  --panel: rgba(4, 22, 48, .55);
  --line: rgba(255, 255, 255, .14);
  --ink: #ffffff;
  --muted: #b8cbe4;
  --orange: #f58426;
  --win: #45c97f;
  --loss: #ff6b5b;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg-bot); }
html, body { margin: 0; min-height: 100%; }
body {
  background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 70%) fixed, var(--bg-bot);
  color: var(--ink); font: 16px/1.4 var(--body); min-height: 100vh;
  padding-top: max(20px, env(safe-area-inset-top, 0px));
  padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
main { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 4px 6px; }
h1 { font: 800 34px/1 var(--display); letter-spacing: .03em; text-transform: uppercase; margin: 0; display: flex; align-items: center; gap: 10px; }
h1 img { width: 34px; height: 34px; border-radius: 8px; }
h1 span { color: var(--orange); }
button {
  font: 700 13px var(--body); color: var(--bg-bot); background: var(--orange); border: 0;
  border-radius: 999px; padding: 8px 14px; cursor: pointer;
}
button:focus-visible, a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.label {
  font: 700 13px var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--orange);
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
}
.live { color: var(--loss); }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .live::before { animation: none; } }
.board { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.team { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0; }
.team img { width: 44px; height: 44px; object-fit: contain; }
.team .abbr { font: 700 15px var(--display); letter-spacing: .06em; }
.pts { font: 800 54px/1 var(--display); font-variant-numeric: tabular-nums; }
.dim { color: var(--muted); }
.pts.dim { opacity: .6; color: var(--ink); }
.mid { font: 700 14px var(--display); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; text-align: center; }
.foot { margin-top: 10px; font-size: 14px; color: var(--muted); text-align: center; }
.badge { font: 800 15px var(--display); letter-spacing: .08em; padding: 2px 8px; border-radius: 6px; color: #fff; }
.badge.w { background: var(--win); color: #062a17; } .badge.l { background: var(--loss); color: #3a0a05; }
.record { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.record .big { font: 800 52px/1 var(--display); font-variant-numeric: tabular-nums; }
.record .sub { color: var(--muted); font-size: 15px; }
.next-opp { display: flex; align-items: center; gap: 12px; }
.next-opp img { width: 40px; height: 40px; object-fit: contain; }
.next-opp .who { font: 700 24px/1.1 var(--display); }
.next-opp .when { color: var(--muted); font-size: 15px; }
.watch { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.watch a {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  text-decoration: none; color: var(--ink); border: 1px solid rgba(245,132,38,.55); border-radius: 10px; padding: 10px 12px;
  background: rgba(245,132,38,.08);
}
.watch a strong { font-weight: 600; }
.watch a small { color: var(--muted); font-size: 13px; }
.watch a .go { color: var(--orange); font-weight: 700; font-size: 14px; white-space: nowrap; }
.note { font-size: 13px; color: var(--muted); margin-top: 6px; }
.err { color: #ffd2cc; font-size: 15px; }
.err strong { color: #fff; display: block; margin-bottom: 4px; }
.inj-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.inj-row:first-child { border-top: 0; padding-top: 0; }
.inj-name { font-weight: 600; min-width: 0; }
.inj-name small { color: var(--muted); font-weight: 500; margin-left: 6px; font-size: 12px; letter-spacing: .06em; }
.inj-what { color: var(--muted); font-size: 14px; }
.inj-back { grid-column: 2; grid-row: 2; text-align: right; font-size: 14px; white-space: nowrap; }
.tag { grid-column: 2; grid-row: 1; justify-self: end; font: 800 12px var(--display); letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; }
.tag.out { background: var(--loss); color: #3a0a05; }
.tag.doubt { background: var(--orange); color: #3a1c00; }
.tag.dtd { background: #fff; color: #06264d; }
.leaders { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.leader { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; min-width: 0; }
.leader img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: rgba(255,255,255,.08); }
.leader .ini { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.1); font: 800 20px var(--display); }
.leader .val { font: 800 34px/1 var(--display); color: var(--orange); font-variant-numeric: tabular-nums; }
.leader .cat { font: 700 11px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.leader .who { font-size: 13px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.box-wrap { overflow-x: auto; margin: 0 -4px; }
.box { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
.box th { font: 700 11px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 0 3px 6px; white-space: nowrap; }
.box th:first-child, .box td:first-child { text-align: left; }
.box td { padding: 7px 3px; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; }
.box td:first-child { white-space: normal; min-width: 6.5em; }
.box th:first-child, .box td:first-child { position: sticky; left: 0; z-index: 1; background: #0a2a52; padding-left: 4px; box-shadow: 6px 0 6px -6px rgba(0,0,0,.6); }
.box td.pos { color: var(--win); } .box td.neg { color: var(--loss); }
.box td.bpts { font-weight: 800; color: var(--orange); }
.box tr.bench td:first-child { color: var(--muted); }
.box .split td { border-top: 1px solid rgba(245,132,38,.5); }
.box-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 10px; }
.box-head .label { margin-bottom: 0; }
.seg { display: inline-flex; border: 1px solid rgba(245,132,38,.6); border-radius: 999px; padding: 2px; }
.seg button { background: none; color: var(--muted); border: 0; border-radius: 999px; padding: 5px 11px; font: 700 12px var(--body); }
.seg button[aria-selected="true"] { background: var(--orange); color: var(--bg-bot); }
.box-foot { margin-top: 8px; font-size: 12px; color: var(--muted); }
.stamp { text-align: center; font-size: 12px; color: var(--muted); }
</style>
</head>

<script>
const BASE = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba";
const TEAM = "ny";            // ESPN slug for the Knicks
const ABBR = "NY";
const TZ = "America/New_York";
let liveTimer = null;

// ESPN serves the same data from two hosts; try the backup if the first fails
const HOSTS = ["https://site.api.espn.com", "https://site.web.api.espn.com"];
async function getJSON(url) {
  let lastErr;
  for (const host of HOSTS) {
    try {
      const u = url.replace("https://site.api.espn.com", host);
      const r = await fetch(u + (u.includes("?") ? "&" : "?") + "_=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

function showError(err) {
  const local = !/^https?:$/.test(location.protocol);
  const msg = local
    ? `<strong>Can't get scores from the saved file.</strong>Your iPhone blocks a saved file from reaching the internet. Open this page from its web link instead (the GitHub Pages step) and it will load.`
    : `<strong>Couldn't reach ESPN.</strong>Check your connection and tap Refresh. (${esc(err && err.message || "network error")})`;
  document.getElementById("gameLabel").className = "label";
  document.getElementById("gameLabel").textContent = "Latest game";
  ["gameBody", "recordBody", "nextBody", "injBody", "leadersBody", "boxBody"].forEach((id, i) => {
    const el = document.getElementById(id);
    el.classList.remove("dim");
    el.innerHTML = i === 0 ? `<div class="err">${msg}</div>` : `<span class="dim">Waiting on the connection above.</span>`;
  });
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const comp = ev => (ev && ev.competitions && ev.competitions[0]) || {};
const state = ev => ev?.status?.type?.state || comp(ev)?.status?.type?.state || "";
const statusOf = ev => ev?.status || comp(ev)?.status || {};
const isKnicks = c => c?.team?.abbreviation === ABBR || c?.team?.slug === "new-york-knicks";
const scoreOf = c => {
  if (c?.score == null) return "–";
  return typeof c.score === "object" ? (c.score.displayValue ?? c.score.value ?? "–") : c.score;
};
const logoOf = t => t?.logo || (t?.logos && t.logos[0]?.href) || "";

function fmtDate(iso, withTime = true) {
  const d = new Date(iso);
  const opts = { timeZone: TZ, weekday: "short", month: "short", day: "numeric" };
  if (withTime) { opts.hour = "numeric"; opts.minute = "2-digit"; }
  return d.toLocaleString("en-US", opts) + (withTime ? " ET" : "");
}

function teamCell(c) {
  const t = c.team || {};
  const logo = logoOf(t);
  return `<div class="team">${logo ? `<img src="${esc(logo)}" alt="">` : ""}<span class="abbr">${esc(t.abbreviation || t.shortDisplayName)}</span></div>`;
}

function renderGame(ev, live) {
  const label = document.getElementById("gameLabel");
  const body = document.getElementById("gameBody");
  body.classList.remove("dim");
  if (!ev) { label.textContent = "Latest game"; body.innerHTML = `<span class="dim">No games played yet this season.</span>`; return; }
  const c = comp(ev);
  const cs = c.competitors || [];
  const away = cs.find(x => x.homeAway === "away") || cs[0];
  const home = cs.find(x => x.homeAway === "home") || cs[1];
  const ny = cs.find(isKnicks);
  const opp = cs.find(x => x !== ny);
  const st = statusOf(ev);

  if (live) {
    label.className = "label live";
    label.textContent = "Live now";
  } else {
    label.className = "label";
    let badge = "";
    if (ny && opp) {
      let won = ny.winner;
      if (won == null) won = Number(scoreOf(ny)) > Number(scoreOf(opp));
      badge = `<span class="badge ${won ? "w" : "l"}">${won ? "W" : "L"}</span>`;
    }
    label.innerHTML = `Latest game ${badge}`;
  }

  const ptsClass = side => {
    if (live || !ny) return "pts";
    return "pts" + (side === ny ? "" : " dim");
  };
  const mid = live ? esc(st.type?.shortDetail || st.type?.detail || "In progress") : "Final" + (/OT/.test(st.type?.shortDetail || "") ? " / " + esc(st.type.shortDetail.replace(/^Final\/?/, "")) : "");
  body.innerHTML = `
    <div class="board">
      ${teamCell(away)}
      <div class="mid">@</div>
      ${teamCell(home)}
      <div class="${ptsClass(away)}" style="text-align:center">${esc(scoreOf(away))}</div>
      <div class="mid">${mid}</div>
      <div class="${ptsClass(home)}" style="text-align:center">${esc(scoreOf(home))}</div>
    </div>
    <div class="foot">${esc(fmtDate(ev.date, false))}${c.venue?.fullName ? " · " + esc(c.venue.fullName) : ""}</div>`;
}

function renderRecord(teamData, events) {
  const body = document.getElementById("recordBody");
  body.classList.remove("dim");
  const t = teamData?.team || {};
  const items = t.record?.items || [];
  const total = items.find(i => i.type === "total") || items[0];
  const home = items.find(i => i.type === "home");
  const road = items.find(i => i.type === "road" || i.type === "away");
  let summary = total?.summary;

  // Fallback: count completed games from the schedule
  if (!summary && events.length) {
    let w = 0, l = 0;
    events.filter(e => statusOf(e).type?.completed).forEach(e => {
      const ny = (comp(e).competitors || []).find(isKnicks);
      if (ny?.winner === true) w++; else if (ny?.winner === false) l++;
    });
    summary = `${w}-${l}`;
  }
  const parts = [];
  if (t.standingSummary) parts.push(esc(t.standingSummary));
  if (home?.summary) parts.push("Home " + esc(home.summary));
  if (road?.summary) parts.push("Road " + esc(road.summary));
  body.innerHTML = `<div class="record"><span class="big">${esc(summary || "0-0")}</span><span class="sub">${parts.join(" · ")}</span></div>`;
}

// Map a TV network to where it streams
function streamFor(name) {
  const n = name.toUpperCase();
  if (n.includes("MSG")) return { svc: "MSG+ (Gotham Sports app)", url: "https://www.gothamsports.com/" };
  if (n.includes("PRIME") || n.includes("AMAZON")) return { svc: "Prime Video", url: "https://www.amazon.com/primevideo" };
  if (n.includes("PEACOCK") || n.includes("NBC")) return { svc: "Peacock", url: "https://www.peacocktv.com/" };
  if (n.includes("ESPN") || n === "ABC") return { svc: "ESPN app", url: "https://www.espn.com/watch/" };
  if (n.includes("NBA TV")) return { svc: "NBA app (NBA TV)", url: "https://www.nba.com/watch" };
  if (n.includes("TNT") || n.includes("TBS") || n.includes("TRUTV")) return { svc: "HBO Max", url: "https://www.hbomax.com/" };
  return null;
}

function networksOf(ev) {
  const c = comp(ev);
  const out = [];
  const add = (name, market) => {
    if (!name) return;
    const m = String(market || "").toLowerCase();
    if (!out.some(o => o.name === name)) out.push({ name, national: m.includes("national") });
  };
  (c.broadcasts || []).forEach(b => {
    if (Array.isArray(b.names)) b.names.forEach(n => add(n, b.market));
    else add(b.media?.shortName || b.media?.name, b.market?.type || b.market);
  });
  (c.geoBroadcasts || []).forEach(g => add(g.media?.shortName, g.market?.type));
  out.sort((a, b) => b.national - a.national);
  return out;
}

function renderNext(ev) {
  const body = document.getElementById("nextBody");
  body.classList.remove("dim");
  if (!ev) { body.innerHTML = `<span class="dim">No upcoming game on the schedule.</span>`; return; }
  const c = comp(ev);
  const cs = c.competitors || [];
  const ny = cs.find(isKnicks);
  const opp = cs.find(x => x !== ny) || {};
  const atHome = ny?.homeAway === "home";
  const ot = opp.team || {};
  const logo = logoOf(ot);
  const nets = networksOf(ev);
  const hasNational = nets.some(n => n.national);

  let watch = "";
  if (nets.length) {
    watch = `<div class="watch">` + nets.map(n => {
      const s = streamFor(n.name);
      const tag = n.national ? "National TV" : "Local TV";
      return s
        ? `<a href="${s.url}" target="_blank" rel="noopener"><span><strong>${esc(s.svc)}</strong><br><small>${esc(n.name)} · ${tag}</small></span><span class="go">Open ›</span></a>`
        : `<a href="https://www.google.com/search?q=${encodeURIComponent(n.name + " streaming")}" target="_blank" rel="noopener"><span><strong>${esc(n.name)}</strong><br><small>${tag}</small></span><span class="go">Find ›</span></a>`;
    }).join("") + `</div>`;
    if (hasNational && !nets.some(n => n.name.toUpperCase().includes("MSG")))
      watch += `<div class="note">National exclusive, so it won't be on MSG.</div>`;
  } else {
    watch = `<div class="note">Broadcast not announced yet. Most non-national Knicks games stream on MSG+ (Gotham Sports app).</div>`;
  }

  body.innerHTML = `
    <div class="next-opp">
      ${logo ? `<img src="${esc(logo)}" alt="">` : ""}
      <div style="min-width:0">
        <div class="who">${atHome ? "vs" : "@"} ${esc(ot.displayName || ot.shortDisplayName || "TBD")}</div>
        <div class="when">${esc(fmtDate(ev.date))}${c.venue?.fullName ? " · " + esc(c.venue.fullName) : ""}</div>
      </div>
    </div>${watch}`;
}

// ---------- Injury report, season leaders, box score ----------
const shortName = a => a?.shortName || a?.displayName || a?.fullName || "";
const posOf = a => a?.position?.abbreviation || "";

// ESPN's roster lists each player's current injury; the next game's preview lists them too
function injuriesFromRoster(j) {
  if (!j) return null;
  let ath = j.athletes || [];
  if (ath.length && Array.isArray(ath[0]?.items)) ath = ath.flatMap(g => g.items || []);
  const out = [];
  ath.forEach(a => (a.injuries || []).forEach(inj => out.push({ a, inj })));
  return out;
}
function injuriesFromSummary(j) {
  const block = (j?.injuries || []).find(b => b.team?.abbreviation === ABBR || b.team?.slug === "new-york-knicks");
  if (!block) return null;
  return (block.injuries || []).map(inj => ({ a: inj.athlete || {}, inj }));
}
function injLine(inj) {
  const d = inj.details || {};
  const part = [d.side && d.side !== "Not Specified" ? d.side : "", d.location || d.type || "", d.detail || ""].filter(Boolean).join(" ").trim();
  return part || inj.shortComment?.split(/[.(]/)[0] || inj.type?.description || "Injury";
}
function injReturn(inj) {
  const r = inj.details?.returnDate;
  if (r) {
    const d = new Date(r.length <= 10 ? r + "T12:00:00" : r);
    if (!isNaN(d)) return "Back ~" + d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }
  return "Return date not given";
}
function renderInjuries(list) {
  const body = document.getElementById("injBody");
  body.classList.remove("dim");
  if (list == null) { body.innerHTML = `<span class="dim">Injury report isn't available right now. Tap Refresh.</span>`; return; }
  if (!list.length) { body.innerHTML = `<span class="dim">No injuries listed. Full roster available.</span>`; return; }
  const rank = st => /out/i.test(st) ? 0 : /doubt/i.test(st) ? 1 : 2;
  list.sort((x, y) => rank(x.inj.status) - rank(y.inj.status));
  body.innerHTML = list.map(({ a, inj }) => {
    const st = inj.status || inj.type?.description || "Injured";
    const cls = /out/i.test(st) ? "out" : /doubt/i.test(st) ? "doubt" : "dtd";
    return `<div class="inj-row"><div class="inj-name">${esc(a.displayName || shortName(a))}<small>${esc(posOf(a))}</small></div>
      <span class="tag ${cls}">${esc(st)}</span><div class="inj-what">${esc(injLine(inj))}</div><div class="inj-back">${esc(injReturn(inj))}</div></div>`;
  }).join("") + `<div class="note">From ESPN. Return dates are estimates.</div>`;
}

// Season leaders come from the next game's preview; after a game ESPN shows that game's leaders instead
function renderLeaders(summary, isPreview) {
  const body = document.getElementById("leadersBody");
  body.classList.remove("dim");
  document.getElementById("leadersLabel").textContent = isPreview ? "Season leaders" : "Last game leaders";
  const block = (summary?.leaders || []).find(b => b.team?.abbreviation === ABBR || b.team?.slug === "new-york-knicks");
  const want = [["points", "PTS", "pointsPerGame"], ["rebounds", "REB", "reboundsPerGame"], ["assists", "AST", "assistsPerGame"]];
  const cats = block?.leaders || [];
  const cells = want.map(([n, label, alt]) => {
    const c = cats.find(x => x.name === n || x.name === alt || (x.abbreviation || "").toUpperCase() === label);
    const top = c?.leaders?.[0];
    if (!top) return "";
    const a = top.athlete || {};
    const img = typeof a.headshot === "string" ? a.headshot : (a.headshot?.href || "");
    const val = String(top.displayValue || "").split(/[ ,]/)[0];
    const initials = (a.displayName || "").split(" ").map(w => w[0]).join("").slice(0, 2);
    return `<div class="leader">${img ? `<img src="${esc(img)}" alt="">` : `<span class="ini">${esc(initials)}</span>`}<span class="val">${esc(val)}</span><span class="cat">${isPreview ? label + " / game" : label}</span><span class="who">${esc(shortName(a))}</span></div>`;
  }).filter(Boolean);
  body.innerHTML = cells.length ? `<div class="leaders">${cells.join("")}</div>` : `<span class="dim">Leaders show up once the season has a game played.</span>`;
}

// Box score: a "Last game" view and a "Season averages" view built from every completed game
const isNYBlock = b => b.team?.abbreviation === ABBR || b.team?.slug === "new-york-knicks";
let boxView = "last", boxLast = null, boxEvent = null, boxSeason = null;
try { boxView = localStorage.getItem("knx-boxview") || "last"; } catch (e) {}

// Turn one game's ESPN summary into compact player lines
function linesFrom(summary) {
  const st = (summary?.boxscore?.players || []).find(isNYBlock)?.statistics?.[0];
  if (!st) return null;
  const labels = (st.labels || st.names || []).map(x => String(x).toUpperCase());
  const ix = k => labels.indexOf(k);
  const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
  const pair = v => { const m = String(v ?? "").match(/(\d+)\s*-\s*(\d+)/); return m ? [+m[1], +m[2]] : [0, 0]; };
  return (st.athletes || [])
    .filter(p => !p.didNotPlay && (p.stats || []).length && num(p.stats[ix("MIN")]) > 0)
    .map(p => {
      const a = p.athlete || {};
      const [fgm, fga] = pair(p.stats[ix("FG")]), [tpm, tpa] = pair(p.stats[ix("3PT")]);
      return { id: String(a.id || a.displayName), name: shortName(a), starter: !!p.starter,
        min: num(p.stats[ix("MIN")]), pts: num(p.stats[ix("PTS")]), reb: num(p.stats[ix("REB")]), ast: num(p.stats[ix("AST")]),
        stl: num(p.stats[ix("STL")]), blk: num(p.stats[ix("BLK")]), pm: ix("+/-") >= 0 ? num(p.stats[ix("+/-")]) : null,
        fgm, fga, tpm, tpa };
    });
}

function renderBoxCard() {
  const body = document.getElementById("boxBody");
  body.classList.remove("dim");
  document.getElementById("segLast").setAttribute("aria-selected", boxView === "last");
  document.getElementById("segSeason").setAttribute("aria-selected", boxView === "season");
  const live = state(boxEvent) === "in";
  document.getElementById("segLast").textContent = live ? "Live" : "Last game";
  boxView === "season" ? renderSeason(body) : renderLastGame(body, live);
}

function renderLastGame(body, live) {
  const lines = linesFrom(boxLast);
  if (!lines) { body.innerHTML = `<span class="dim">Box score not available yet.</span>`; return; }
  const starters = lines.filter(p => p.starter).sort((a, b) => b.pts - a.pts);
  const bench = lines.filter(p => !p.starter).sort((a, b) => b.pts - a.pts);
  const pmCell = v => v == null ? "<td>–</td>" : `<td class="${v > 0 ? "pos" : v < 0 ? "neg" : ""}">${v > 0 ? "+" + v : v}</td>`;
  const row = (p, cls) => `<tr class="${cls}"><td>${esc(p.name)}</td><td>${p.min}</td><td class="bpts">${p.pts}</td><td>${p.reb}</td><td>${p.ast}</td><td>${p.stl}</td><td>${p.blk}</td>${pmCell(p.pm)}<td>${p.fgm}-${p.fga}</td><td>${p.tpm}-${p.tpa}</td></tr>`;
  const opp = (comp(boxEvent).competitors || []).find(c => !isKnicks(c))?.team;
  body.innerHTML = `<div class="box-wrap"><table class="box">
      <thead><tr><th>Player</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>+/-</th><th>FG</th><th>3PT</th></tr></thead>
      <tbody>${starters.map(p => row(p, "")).join("")}${bench.map((p, i) => row(p, "bench" + (i === 0 ? " split" : ""))).join("")}</tbody>
    </table></div>
    <div class="box-foot">${live ? "Live · " : ""}${opp ? "vs " + esc(opp.displayName || opp.abbreviation) + " · " : ""}Starters first, then bench (gray). Swipe the table sideways for more. +/− is how much the Knicks outscored the other team with that player on the court. FG and 3PT are made-attempted.</div>`;
}

function renderSeason(body) {
  if (!boxSeason) { body.innerHTML = `<span class="dim">Adding up the season…</span>`; return; }
  const { players, games } = boxSeason;
  if (!games) { body.innerHTML = `<span class="dim">Season averages appear after the first game.</span>`; return; }
  const one = v => (Math.round(v * 10) / 10).toFixed(1);
  const pct = (m, a) => a ? Math.round(m / a * 100) + "%" : "–";
  const rows = Object.values(players).sort((a, b) => b.pts / b.gp - a.pts / a.gp);
  const pmAvg = p => { if (!p.pmGames) return "<td>–</td>"; const v = Math.round(p.pm / p.pmGames * 10) / 10; return `<td class="${v > 0 ? "pos" : v < 0 ? "neg" : ""}">${v > 0 ? "+" : ""}${v.toFixed(1)}</td>`; };
  body.innerHTML = `<div class="box-wrap"><table class="box">
      <thead><tr><th>Player</th><th>GP</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>+/-</th><th>FG%</th><th>3P%</th></tr></thead>
      <tbody>${rows.map(p => `<tr><td>${esc(p.name)}</td><td>${p.gp}</td><td>${one(p.min / p.gp)}</td><td class="bpts">${one(p.pts / p.gp)}</td><td>${one(p.reb / p.gp)}</td><td>${one(p.ast / p.gp)}</td><td>${one(p.stl / p.gp)}</td><td>${one(p.blk / p.gp)}</td>${pmAvg(p)}<td>${pct(p.fgm, p.fga)}</td><td>${pct(p.tpm, p.tpa)}</td></tr>`).join("")}</tbody>
    </table></div>
    <div class="box-foot">Per-game averages over ${games} game${games === 1 ? "" : "s"}, sorted by points. Swipe the table sideways for more. GP is games played. FG% and 3P% are the share of shots made.</div>`;
}

// Finished games never change, so each one is saved on the phone and only fetched once
async function buildSeason(doneEvents) {
  const cache = id => { try { return JSON.parse(localStorage.getItem("knx-box2-" + id)); } catch (e) { return null; } };
  const save = (id, v) => { try { localStorage.setItem("knx-box2-" + id, JSON.stringify(v)); } catch (e) {} };
  const games = {};
  const missing = [];
  doneEvents.forEach(e => { const c = cache(e.id); if (c) games[e.id] = c; else missing.push(e.id); });
  for (let i = 0; i < missing.length; i += 6) {
    const batch = missing.slice(i, i + 6);
    const res = await Promise.allSettled(batch.map(id => getJSON(`${BASE}/summary?event=${id}`)));
    res.forEach((r, k) => {
      const lines = r.status === "fulfilled" ? linesFrom(r.value) : null;
      if (lines && lines.length) { games[batch[k]] = lines; save(batch[k], lines); }
    });
  }
  const players = {};
  Object.values(games).forEach(lines => lines.forEach(l => {
    const p = players[l.id] || (players[l.id] = { name: l.name, gp: 0, min: 0, pts: 0, reb: 0, ast: 0, stl: 0, blk: 0, pm: 0, pmGames: 0, fgm: 0, fga: 0, tpm: 0, tpa: 0 });
    p.gp++; ["min", "pts", "reb", "ast", "stl", "blk", "fgm", "fga", "tpm", "tpa"].forEach(k => p[k] += l[k] || 0);
    if (l.pm != null) { p.pm += l.pm; p.pmGames++; }
  }));
  return { players, games: Object.keys(games).length };
}

["segLast", "segSeason"].forEach(id => document.getElementById(id).addEventListener("click", () => {
  boxView = id === "segLast" ? "last" : "season";
  try { localStorage.setItem("knx-boxview", boxView); } catch (e) {}
  renderBoxCard();
}));

async function loadExtras(latestEvent, nextEvent, doneEvents) {
  const sum = id => id ? getJSON(`${BASE}/summary?event=${id}`) : Promise.reject(new Error("no game"));
  const [rosterR, boxR, nextR] = await Promise.allSettled([
    getJSON(`${BASE}/teams/${TEAM}/roster`),
    sum(latestEvent?.id),
    sum(nextEvent?.id)
  ]);
  const ok = r => r.status === "fulfilled" ? r.value : null;
  const safe = (id, fn) => { try { fn(); } catch (e) {
    const el = document.getElementById(id); el.classList.add("dim"); el.textContent = "Couldn't read this part of ESPN's data. Tap Refresh.";
  } };
  safe("injBody", () => {
    let list = injuriesFromRoster(ok(rosterR));
    if (!list || !list.length) list = injuriesFromSummary(ok(nextR)) ?? list;
    renderInjuries(list);
  });
  safe("leadersBody", () => {
    if (ok(nextR)?.leaders?.length) renderLeaders(ok(nextR), true);
    else renderLeaders(ok(boxR), false);
  });
  boxLast = ok(boxR); boxEvent = latestEvent;
  safe("boxBody", renderBoxCard);
  boxSeason = await buildSeason(doneEvents || []).catch(() => ({ players: {}, games: 0 }));
  safe("boxBody", renderBoxCard);
}

async function load() {
  clearTimeout(liveTimer);
  const btn = document.getElementById("refresh");
  btn.textContent = "Updating…";
  try {
    const [teamR, schedR, boardR] = await Promise.allSettled([
      getJSON(`${BASE}/teams/${TEAM}`),
      getJSON(`${BASE}/teams/${TEAM}/schedule`),
      getJSON(`${BASE}/scoreboard`)
    ]);
    if (teamR.status === "rejected" && schedR.status === "rejected") throw teamR.reason;

    let events = schedR.status === "fulfilled" ? (schedR.value.events || []) : [];
    // Early in the year the regular-season list can be empty; fall back to preseason
    if (!events.some(e => statusOf(e).type?.completed) && !events.length) {
      try { events = (await getJSON(`${BASE}/teams/${TEAM}/schedule?seasontype=1`)).events || []; } catch (e) {}
    }
    events.sort((a, b) => new Date(a.date) - new Date(b.date));

    // Live game: prefer today's scoreboard (fresher), else schedule
    const board = boardR.status === "fulfilled" ? (boardR.value.events || []) : [];
    let live = board.find(e => state(e) === "in" && (comp(e).competitors || []).some(isKnicks))
            || events.find(e => state(e) === "in");

    const done = events.filter(e => statusOf(e).type?.completed);
    let last = done[done.length - 1];
    // If today's scoreboard has a just-finished Knicks game, use it (scores land there first)
    const boardFinal = board.find(e => statusOf(e).type?.completed && (comp(e).competitors || []).some(isKnicks));
    if (boardFinal && (!last || new Date(boardFinal.date) >= new Date(last.date))) last = boardFinal;

    let next = events.find(e => state(e) === "pre" && new Date(e.date) > Date.now() - 3 * 3600e3 && e !== live);
    if (!next && teamR.status === "fulfilled") next = (teamR.value.team?.nextEvent || []).find(e => state(e) === "pre");
    // Board copy of the next game often has better broadcast data
    if (next) {
      const b = board.find(e => e.id === next.id);
      if (b) next = b;
    }

    // Render each card on its own so one bad field can't leave the others stuck on "Loading"
    const safe = (id, fn) => { try { fn(); } catch (e) {
      const el = document.getElementById(id); el.classList.add("dim"); el.textContent = "Couldn't read this part of ESPN's data. Tap Refresh.";
    } };
    safe("gameBody", () => renderGame(live || last, !!live));
    safe("recordBody", () => renderRecord(teamR.status === "fulfilled" ? teamR.value : null, events));
    safe("nextBody", () => renderNext(next));
    await loadExtras(live || last, next, done.filter(e => !board.some(b => b.id === e.id && state(b) === "in")));

    document.getElementById("stamp").textContent = "Updated " + new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) + (live ? " · refreshing every 30s" : "");
    if (live) liveTimer = setTimeout(load, 30000);
  } catch (err) {
    showError(err);
  } finally {
    btn.textContent = "Refresh";
  }
}

document.getElementById("refresh").addEventListener("click", load);
// Home-screen apps on iPhone resume instead of reloading, so refresh whenever it comes back into view
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
window.addEventListener("pageshow", e => { if (e.persisted) load(); });
load();
</script>
</body>
</html>
